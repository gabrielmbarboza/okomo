services:
  okomo_api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: okomo_api
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${POSTGRES_USER:-okomo}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-okomo_dev}
      - DATABASE_NAME=${POSTGRES_DB:-okomo_development}
      - DATABASE_QUEUE_NAME=${POSTGRES_QUEUE_DB:-okomo_development_queue}
      - RAILS_LOG_TO_STDOUT=true
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:16-alpine
    container_name: okomo_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-okomo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-okomo_dev}
      - POSTGRES_DB=${POSTGRES_DB:-okomo_development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okomo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  solid_queue:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: okomo_solid_queue
    command: bin/jobs start
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${POSTGRES_USER:-okomo}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-okomo_dev}
      - DATABASE_NAME=${POSTGRES_DB:-okomo_development}
      - DATABASE_QUEUE_NAME=${POSTGRES_QUEUE_DB:-okomo_development_queue}
      - RAILS_LOG_TO_STDOUT=true
      - SOLID_QUEUE_THREADS=${SOLID_QUEUE_THREADS:-3}
      - SOLID_QUEUE_PROCESSES=${SOLID_QUEUE_PROCESSES:-1}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - with-jobs

  redis:
    image: redis:7-alpine
    container_name: okomo_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-redis

volumes:
  postgres_data:
  bundle_cache:
  redis_data:
